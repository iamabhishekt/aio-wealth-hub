[package]
name = "aio-wealth-backend"
version = "0.1.0"
edition = "2021"
authors = ["iamabhishekt <abhishekthakur.art@protonmail.com>"]
description = "High-performance local Rust backend for AIO Wealth Hub (multi-currency, zero-cost connectors, forecasting)"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1.0"
thiserror = "1.0"
ofxy = "0.2"

[lib]
name = "aio_wealth_core"
path = "src/lib.rs"

[[bin]]
name = "aio-wealth-server"
path = "src/main.rs"
